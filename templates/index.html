<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Query Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-700">SQL Query Interface</h1>
        
        <!-- Connection Form -->
        <div id="connection-form" class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4">Database Connection</h2>
            <form id="db-connection-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Host</label>
                        <input type="text" id="db-host" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" value="localhost" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Database</label>
                        <input type="text" id="db-name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Username</label>
                        <input type="text" id="db-user" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="db-password" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" required>
                    </div>
                </div>
                <div class="flex items-center">
                    <input id="ssl-disabled" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" checked>
                    <label for="ssl-disabled" class="ml-2 block text-sm text-gray-700">Disable SSL</label>
                </div>
                <div>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Connect to Database
                    </button>
                </div>
            </form>
        </div>

        <!-- Main Content (hidden until connected) -->
        <div id="main-content" class="hidden">
            <!-- Tabs -->
            <div class="border-b border-gray-200 mb-6">
                <nav class="-mb-px flex space-x-8" aria-label="Tabs">
                    <button id="sql-tab" class="tab-button active border-blue-500 text-blue-600 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                        SQL Query
                    </button>
                    <button id="nl-tab" class="tab-button border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                        Natural Language
                    </button>
                </nav>
            </div>

            <!-- SQL Query Tab Content -->
            <div id="sql-tab-content" class="tab-content">
                <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                    <label for="sql-query" class="block text-sm font-medium text-gray-700 mb-2">Enter your SQL query:</label>
                    <div class="flex space-x-2">
                        <textarea id="sql-query" rows="4" class="flex-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" placeholder="SELECT * FROM your_table LIMIT 10;"></textarea>
                    </div>
                    <div class="mt-4">
                        <button id="execute-sql" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            Execute Query
                        </button>
                    </div>
                </div>
            </div>

            <!-- Natural Language Tab Content -->
            <div id="nl-tab-content" class="tab-content hidden">
                <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                    <label for="nl-query" class="block text-sm font-medium text-gray-700 mb-2">Ask a question in natural language:</label>
                    <div class="flex space-x-2">
                        <input type="text" id="nl-query" class="flex-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" placeholder="E.g., Show me all customers from New York">
                        <button id="ask-nl" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            Ask
                        </button>
                    </div>
                </div>
            </div>

            <!-- Results Section -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold mb-4">Results</h2>
                <div id="results" class="overflow-x-auto">
                    <p class="text-gray-500 italic">Your query results will appear here...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
